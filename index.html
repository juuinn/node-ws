<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Zen Garden | 独一无二的你</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden; /* 防止出现滚动条 */
            background: #0f0c29; /* 备用背景色 */
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* 覆盖在Canvas之上的文字容器 */
        .content {
            position: absolute;
            text-align: center;
            z-index: 10;
            pointer-events: none; /* 让鼠标事件穿透文字，直接作用于Canvas */
            mix-blend-mode: overlay;
        }

        h1 {
            font-size: 4rem;
            font-weight: 100;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: glow 3s ease-in-out infinite alternate;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        p {
            margin-top: 20px;
            font-size: 1.2rem;
            opacity: 0.8;
            letter-spacing: 3px;
            font-weight: 300;
        }

        /* 文字发光动画 */
        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6; }
        }

        canvas {
            display: block;
        }
        
        /* 简单的打字机光标效果 */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: white;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 画布层 -->
    <canvas id="canvas"></canvas>

    <!-- 内容层 -->
    <div class="content">
        <h1 id="title">ZEN SPACE</h1>
        <p>移动鼠标，连接星尘 <span class="cursor"></span></p>
    </div>

    <script>
        /**
         * 逻辑核心：粒子星座系统
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let particlesArray;
        
        // 调整画布大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 鼠标交互对象
        let mouse = {
            x: null,
            y: null,
            radius: (canvas.height/80) * (canvas.width/80)
        }

        // 监听鼠标移动
        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // 监听窗口大小改变
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mouse.radius = (canvas.height/80) * (canvas.width/80);
            init();
        });

        // 鼠标移出时清空坐标
        window.addEventListener('mouseout', function(){
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // 粒子类
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            // 绘制单个粒子
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color; // 使用动态颜色
                ctx.fill();
            }

            // 更新粒子位置
            update() {
                // 边界检测：碰到边缘反弹
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                // 鼠标交互：碰撞检测
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);

                // 如果粒子在鼠标周围，让它稍微变大并弹开
                if (distance < mouse.radius + this.size){
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                        this.x += 10;
                    }
                    if (mouse.x > this.x && this.x > this.size * 10) {
                        this.x -= 10;
                    }
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                        this.y += 10;
                    }
                    if (mouse.y > this.y && this.y > this.size * 10) {
                        this.y -= 10;
                    }
                }

                // 移动粒子
                this.x += this.directionX;
                this.y += this.directionY;

                // 绘制
                this.draw();
            }
        }

        // 初始化粒子群
        function init() {
            particlesArray = [];
            // 根据屏幕大小决定粒子数量
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 3) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 2) - 1; // 速度 -1 到 1
                let directionY = (Math.random() * 2) - 1;
                let color = '#ffffff';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // 连线效果
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                    + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    // 如果两个粒子距离足够近，画线
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        ctx.strokeStyle = 'rgba(255, 255, 255,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        // 启动
        init();
        animate();

        // 一个额外的小彩蛋：根据时间改变标题
        const title = document.getElementById('title');
        const hour = new Date().getHours();
        if (hour >= 6 && hour < 12) title.innerText = "MORNING MIST";
        else if (hour >= 12 && hour < 18) title.innerText = "DAYLIGHT FLOW";
        else if (hour >= 18 && hour < 24) title.innerText = "EVENING STAR";
        else title.innerText = "MIDNIGHT VOID";

    </script>
</body>
</html>
